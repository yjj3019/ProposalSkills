name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install python-pptx
        run: python -m pip install --quiet python-pptx
      - name: Install LibreOffice (render path)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-nanum >/dev/null
      - name: Unit tests (repo root)
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: proposal_gate tests
        run: python skills/create-winning-proposal/scripts/test_proposal_gate.py -v
      - name: create-best-proposal tests
        run: python skills/create-best-proposal/scripts/test_best_proposal.py -v
      - name: Golden fixtures through unified_gate
        shell: bash
        run: |
          set -e
          GATE=skills/create-best-proposal/scripts/unified_gate.py
          READY=skills/create-best-proposal/fixtures/audit_ready_financial.json
          # 문서 없이 audit만 → AUDIT-VALID (제출 준비로 승격하지 않는다)
          python "$GATE" "$READY" --audit-only --no-explain | grep -q "STATUS: AUDIT-VALID"
          # 제출 모드인데 문서를 주지 않으면 차단
          if python "$GATE" "$READY" --no-explain; then exit 1; fi
          # 실제 파일과 해시가 일치할 때만 SUBMISSION-READY
          python - "$READY" "${RUNNER_TEMP}" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from pptx import Presentation
          from pptx.util import Inches
          audit_path, tmp = Path(sys.argv[1]), Path(sys.argv[2])
          # 양성 대조군은 실제 로더가 여는 파일이어야 한다(필수 파트 빠진 ZIP 금지).
          doc = tmp / "final.pptx"
          prs = Presentation()
          slide = prs.slides.add_slide(prs.slide_layouts[6])
          slide.shapes.add_textbox(Inches(1), Inches(1), Inches(6), Inches(1)).text_frame.text = "정상 문서"
          prs.save(str(doc))
          data = json.loads(audit_path.read_text(encoding="utf-8"))
          digest = "sha256:" + hashlib.sha256(doc.read_bytes()).hexdigest()
          data["render"]["artifact_hash"] = data["package"]["artifact_hash"] = digest
          (tmp / "bound.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY
          python "$GATE" "${RUNNER_TEMP}/bound.json" --doc "${RUNNER_TEMP}/final.pptx" --no-explain | grep -q "STATUS: SUBMISSION-READY"
          # audit-only는 설명 본문에서도 제출 가능이라고 말하지 않는다
          python "$GATE" "$READY" --audit-only | grep -q "게이트 결과: AUDIT-VALID"
          if python "$GATE" "$READY" --audit-only | grep -q "제출 가능\."; then exit 1; fi
          # artifact_required=false로 검증 의무를 끄지 못한다
          python - "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          tmp = Path(sys.argv[1])
          data = json.loads((tmp / "bound.json").read_text(encoding="utf-8"))
          data["artifact_required"] = False
          data["render"].update(verified=False, artifact_hash="", tool="", evidence=[])
          (tmp / "bypass.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY
          if python "$GATE" "${RUNNER_TEMP}/bypass.json" --doc "${RUNNER_TEMP}/final.pptx" --no-explain; then exit 1; fi
          # 검토 이후 바뀐 파일에는 과거 판정을 재사용하지 못한다
          printf 'drift' >> "${RUNNER_TEMP}/final.pptx"
          if python "$GATE" "${RUNNER_TEMP}/bound.json" --doc "${RUNNER_TEMP}/final.pptx" --no-explain; then exit 1; fi
          if python "$GATE" "${RUNNER_TEMP}/bound.json" --stage draft --no-explain; then exit 1; fi
          if python "$GATE" skills/create-best-proposal/fixtures/audit_decision_memo.json --no-explain; then exit 1; fi
          python skills/create-best-proposal/scripts/build_audit_from_meta.py skills/create-best-proposal/fixtures/meta_sample.json -o "${RUNNER_TEMP}/audit.json"
          # 수치 원장: 틀린 합계는 arithmetic=true 자기선언과 무관하게 차단된다
          python - "$READY" "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          audit_path, tmp = Path(sys.argv[1]), Path(sys.argv[2])
          data = json.loads(audit_path.read_text(encoding="utf-8"))
          assert data["checks"]["arithmetic"] is True
          data["numbers"][0]["value"] = 9900000000
          (tmp / "bad_sum.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY
          if python "$GATE" "${RUNNER_TEMP}/bad_sum.json" --audit-only --no-explain; then exit 1; fi
          # 공공 제안: 평가표가 없거나 대응 요구 없는 배점이 있으면 차단된다
          python - "$READY" "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          audit_path, tmp = Path(sys.argv[1]), Path(sys.argv[2])
          data = json.loads(audit_path.read_text(encoding="utf-8"))
          data["context"] = {"buyer_types": ["public"], "stage": "final-submission"}
          (tmp / "public_no_criteria.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          data["evaluation_criteria"] = [{"id": "C1", "label": "기술", "weight": 100}]
          (tmp / "public_orphan_criterion.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          data["requirements"][0]["criterion_ids"] = ["C1"]
          (tmp / "public_ok.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY
          if python "$GATE" "${RUNNER_TEMP}/public_no_criteria.json" --audit-only --no-explain; then exit 1; fi
          if python "$GATE" "${RUNNER_TEMP}/public_orphan_criterion.json" --audit-only --no-explain; then exit 1; fi
          python "$GATE" "${RUNNER_TEMP}/public_ok.json" --audit-only --no-explain | grep -q "STATUS: AUDIT-VALID"
          # 원장이 없으면 제출 모드에서 arithmetic 자기선언만으로 통과하지 못한다
          python - "$READY" "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          audit_path, tmp = Path(sys.argv[1]), Path(sys.argv[2])
          data = json.loads(audit_path.read_text(encoding="utf-8"))
          data.pop("numbers")
          (tmp / "no_ledger.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY
          if python "$GATE" "${RUNNER_TEMP}/no_ledger.json" --audit-only --no-explain; then exit 1; fi
          python score_completeness.py "$READY" | grep -q '"status": "AUDIT-VALID"'
      - name: Deck pipeline golden
        shell: bash
        run: |
          set -e
          python skills/create-proposal-document/scripts/build_deck.py skills/create-proposal-document/fixtures/e2e-mini-rfp/slides.json -o "${RUNNER_TEMP}/draft.pptx" --strict
          python skills/create-proposal-document/scripts/deck_check.py "${RUNNER_TEMP}/draft.pptx" --max-pages 40 --exclude-cover-toc --require-req-ids --stage draft
          # 음성 대조군: 슬라이드가 남은 템플릿과 잘못된 행 분할은 거부한다
          python - "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          from pptx import Presentation
          from pptx.util import Inches
          tmp = Path(sys.argv[1])
          tpl = Presentation()
          tpl.slide_width, tpl.slide_height = Inches(13.333), Inches(7.5)
          s = tpl.slides.add_slide(tpl.slide_layouts[6])
          s.shapes.add_textbox(Inches(1), Inches(1), Inches(8), Inches(1)).text_frame.text = "이전고객 37억원"
          tpl.save(str(tmp / "dirty_template.pptx"))
          (tmp / "bad_rows.json").write_text(json.dumps({
              "meta": {"title": "t", "bidder": "b"},
              "slides": [{"type": "matrix", "title": "조견표", "lead": "요구 대응 현황.",
                          "rows_per_slide": -1,
                          "rows": [{"id": "R1", "text": "필수", "support": "O",
                                    "response_loc": "p.1", "note": ""}]}]}, ensure_ascii=False),
              encoding="utf-8")
          PY
          BUILD=skills/create-proposal-document/scripts/build_deck.py
          SPEC=skills/create-proposal-document/fixtures/e2e-mini-rfp/slides.json
          if python "$BUILD" "$SPEC" -o "${RUNNER_TEMP}/x.pptx" --template "${RUNNER_TEMP}/dirty_template.pptx"; then exit 1; fi
          if python "$BUILD" "${RUNNER_TEMP}/bad_rows.json" -o "${RUNNER_TEMP}/y.pptx"; then exit 1; fi
          # 산출물 프로파일: 각자 자기 기준으로는 통과, 상세본을 발표 기준으로 재면 차단
          for P in detailed-submission presentation executive-summary; do
            python "$BUILD" "$SPEC" -o "${RUNNER_TEMP}/deck_$P.pptx" --profile "$P"
            python skills/create-proposal-document/scripts/deck_check.py "${RUNNER_TEMP}/deck_$P.pptx"
          done
          if python skills/create-proposal-document/scripts/deck_check.py \
               "${RUNNER_TEMP}/deck_detailed-submission.pptx" --profile presentation; then exit 1; fi
          # 원장 수치가 장표에 실제로 있는지 대조한다(골든은 일치, 낡은 값은 차단)
          CHECK=skills/create-proposal-document/scripts/check_numbers.py
          META=skills/create-proposal-document/fixtures/e2e-mini-rfp/meta.json
          python "$CHECK" "${RUNNER_TEMP}/draft.pptx" --audit "$META"
          python - "$META" "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          meta_path, tmp = Path(sys.argv[1]), Path(sys.argv[2])
          data = json.loads(meta_path.read_text(encoding="utf-8"))
          data["numbers"][0]["value"] = 987654  # 장표에 없는 값
          (tmp / "stale_numbers.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY
          if python "$CHECK" "${RUNNER_TEMP}/draft.pptx" --audit "${RUNNER_TEMP}/stale_numbers.json"; then exit 1; fi
          # 음성 대조군: 본문 파트나 관계 파트가 깨진 패키지는 검사 대상이 아니다(exit 2)
          python - "${RUNNER_TEMP}" <<'PY'
          import io, sys, zipfile
          from pathlib import Path
          tmp = Path(sys.argv[1])
          src = zipfile.ZipFile(tmp / "draft.pptx")
          for part, out_name in (("slide1.xml", "broken_slide.pptx"), ("_rels/.rels", "broken_rels.pptx")):
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, "w") as out:
                  for name in src.namelist():
                      out.writestr(name, b"<p:sld><broken" if name.endswith(part) else src.read(name))
              (tmp / out_name).write_bytes(buf.getvalue())
          PY
          for BAD in broken_slide broken_rels; do
            if python skills/create-proposal-document/scripts/deck_check.py "${RUNNER_TEMP}/$BAD.pptx"; then exit 1; fi
          done
      - name: Auto-install smoke test
        shell: bash
        env:
          HOME: ${{ runner.temp }}/fakehome
          USERPROFILE: ${{ runner.temp }}/fakehome
        run: |
          set -e
          mkdir -p "${RUNNER_TEMP}/fakehome/.claude"
          unset AI_SKILLS_DIR CODEX_HOME
          python install_skill.py --list-targets | grep -q ".claude"
          python install_skill.py --auto
          test -f "${RUNNER_TEMP}/fakehome/.claude/skills/create-best-proposal/SKILL.md"
          test -f "${RUNNER_TEMP}/fakehome/.claude/skills/create-winning-proposal/scripts/proposal_gate.py"
          python install_skill.py --auto | grep -q "Skip (exists)"   # 재실행 안전
          # 음성 대조군: 스킬이 아닌 비어 있지 않은 폴더는 지우지 않는다
          mkdir -p "${RUNNER_TEMP}/dest/create-best-proposal"
          echo "user data" > "${RUNNER_TEMP}/dest/create-best-proposal/notes.md"
          if python install_skill.py --dest "${RUNNER_TEMP}/dest"; then exit 1; fi
          test -f "${RUNNER_TEMP}/dest/create-best-proposal/notes.md"
      - name: Install smoke test
        shell: bash
        run: |
          python install_skill.py --dest "${RUNNER_TEMP}/skills" --all
          python "${RUNNER_TEMP}/skills/create-best-proposal/scripts/unified_gate.py" skills/create-best-proposal/fixtures/audit_ready_financial.json --audit-only --no-explain
          python "${RUNNER_TEMP}/skills/create-best-proposal/scripts/score_completeness.py" skills/create-best-proposal/fixtures/audit_ready_financial.json > /dev/null
      - name: Markdown link check
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib, sys
          bad = []
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git' in md.parts: continue
              for m in re.finditer(r'\]\(([^)#\s]+)(#[^)]*)?\)', md.read_text(encoding='utf-8')):
                  t = m.group(1)
                  if t.startswith(('http://', 'https://', 'mailto:')): continue
                  if not (md.parent / t).exists(): bad.append(f"{md}: {t}")
          print("\n".join(bad) or "all local links resolve")
          sys.exit(1 if bad else 0)
          PY
