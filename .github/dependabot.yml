version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # requirements.txt declares tested minimums; raising them can drop supported Python versions.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-packages:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
