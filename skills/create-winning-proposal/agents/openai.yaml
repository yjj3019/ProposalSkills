# Internal evidence and submission layer: explicit invocation only.
# Use create-best-proposal as the full proposal entry point.
interface:
  display_name: "Proposal Evidence and Review"
  short_description: "Bid decisions, evidence, approvals, and submission checks"
  default_prompt: "Use $create-winning-proposal only for bid, audit, and gate work, or when create-best-proposal is unavailable. For full proposals prefer create-best-proposal and report unperformed checks."
policy:
  allow_implicit_invocation: false
